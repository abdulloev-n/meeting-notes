name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main, 'update/**']

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install dependencies
        run: npm ci
      - name: Check data preservation regressions
        run: node --test tests/audit-regressions.test.mjs tests/export-regression.test.mjs
      - name: Prepare interface and bundled audio tools
        run: npm run build
      - name: Check native collection and analysis regressions
        run: cargo test --release --manifest-path src-tauri/Cargo.toml interaction_tests
      - name: Build NSIS installer
        run: npx tauri build --bundles nsis
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Meeting-Notes-0.3.3-Update-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
